<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Duk: Fuga do Banho 🐾🚿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 800px;
      max-height: 450px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #38bdf8;
    }

    @media (min-width: 820px) and (min-height: 480px) {
      #game-wrapper {
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 0 3px #1e293b;
        overflow: hidden;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: pointer;
    }

    /* Top Mobile HUD */
    .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .badge {
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge .num {
      color: #facc15;
      font-size: 16px;
      font-weight: 800;
    }

    .audio-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: white;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    /* Start Screen */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 20;
      padding: 16px;
    }

    .title-banner {
      background: linear-gradient(135deg, #f97316, #ea580c);
      padding: 8px 24px;
      border-radius: 24px;
      box-shadow: 0 6px 18px rgba(234, 88, 12, 0.4);
      border: 2px solid #ffedd5;
      margin-bottom: 12px;
    }

    .title-banner h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .char-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 16px;
      font-size: 13px;
      max-width: 90%;
      line-height: 1.3;
    }

    .touch-hint {
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #fde047;
      font-weight: 600;
    }

    .play-btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: none;
      padding: 14px 40px;
      font-size: 20px;
      font-weight: 800;
      font-family: inherit;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.5);
      border: 2px solid #bbf7d0;
      animation: pulse 1.6s infinite;
      touch-action: manipulation;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Jump Banner for Mobile */
    .jump-tip {
      position: absolute;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.65);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Top Mobile HUD -->
    <div class="hud" id="hud" style="display: none;">
      <div class="badge">
        <span>🐾 Fuga:</span>
        <span class="num" id="distanceVal">0m</span>
      </div>

      <div class="badge">
        <span>🏆 Recorde:</span>
        <span class="num" id="recordVal">0m</span>
      </div>

      <button class="audio-btn" id="audioToggle">🔊</button>
    </div>

    <!-- Mobile Prompt -->
    <div class="jump-tip" id="jumpTip" style="display: none;">
      👆 Toque em qualquer lugar da tela para pular!
    </div>

    <!-- Start Overlay -->
    <div id="start-screen">
      <div class="title-banner">
        <h1>🐾 DUK: FUGA DO BANHO! 🚿</h1>
      </div>

      <div class="char-preview">
        <span style="font-size: 28px;">🐕‍🦺💨🏃‍♀️</span>
        <div>
          <b>Ágata</b> quer dar banho na fazenda!<br>
          Ajude o <b>Duk</b> a pular os obstáculos!
        </div>
      </div>

      <div class="touch-hint">
        📱 <b>Celular:</b> Toque na tela para pular!<br>
        💻 <b>PC:</b> Pressione Espaço ou clique.
      </div>

      <button class="play-btn" id="startBtn">JOGAR AGORA! 🐾</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       DUK: FUGA DO BANHO - ULTRA-LIGHTWEIGHT MOBILE ENGINE (60 FPS)
       Otimizado para Celulares • Física Suave • Obstáculos Baixos
       ========================================================================== */

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const jumpTip = document.getElementById('jumpTip');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('startBtn');
    const distanceVal = document.getElementById('distanceVal');
    const recordVal = document.getElementById('recordVal');
    const audioToggle = document.getElementById('audioToggle');

    // Fixed Virtual Resolution (Ultra-lightweight 16:9)
    const V_W = 800;
    const V_H = 450;
    const GROUND_Y = 370;

    // States
    const STATE_START = 0;
    const STATE_RUNNING = 1;
    const STATE_GAMEOVER = 2;
    let gameState = STATE_START;

    // Stats & Easy Progression
    let distance = 0;
    let highscore = parseInt(localStorage.getItem('duk_mobile_record') || '0', 10);
    recordVal.innerText = highscore + 'm';

    // Relaxed, Mobile-Friendly Speeds
    let baseSpeed = 3.2;
    let gameSpeed = 3.2;
    let maxSpeed = 5.6;
    let speedRate = 0.00015;

    // Audio Engine via Web Audio API (Super lightweight, zero mp3 lag)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
          // Boing suave
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(450, now + 0.14);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'hit') {
          // Toque suave de tropeço
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.26);
        } else if (type === 'splash') {
          // Água do banho
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(520, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'pop') {
          // Bolha de sabão estourando
          osc.type = 'sine';
          osc.frequency.setValueAtTime(650, now);
          osc.frequency.exponentialRampToValueAtTime(950, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.07);
        }
      } catch(e) {}
    }

    // Sound toggle
    audioToggle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      audioToggle.innerText = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) initAudio();
    });

    /* ==========================================================================
       ENTITIES (DUK, ÁGATA, OBSTACLES)
       ========================================================================== */

    // Duk: Floaty, forgiving jump physics with jump buffer
    const duk = {
      x: 180,
      y: GROUND_Y - 44,
      width: 58,
      height: 42,
      vy: 0,
      gravity: 0.62,       // Gravidade suave (fácil de controlar)
      jumpForce: -13.6,    // Pula ~140px, passando com folga de 30px dos obstáculos!
      isGrounded: true,
      jumpBuffer: 0,       // Se apertar antes de cair, pula automaticamente!
      runFrame: 0,
      wobble: 0,

      reset() {
        this.x = 180;
        this.y = GROUND_Y - 44;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpBuffer = 0;
        this.runFrame = 0;
        this.wobble = 0;
      },

      jump() {
        if (this.isGrounded) {
          this.vy = this.jumpForce;
          this.isGrounded = false;
          playSound('jump');
          spawnDust(this.x + 28, GROUND_Y, 4);
        } else {
          // Salva intenção de pulo (Jump buffering)
          this.jumpBuffer = 10;
        }
      },

      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        if (this.y >= GROUND_Y - 44) {
          this.y = GROUND_Y - 44;
          this.vy = 0;
          this.isGrounded = true;

          // Se o jogador tocou um pouco antes de tocar o chão, executa o pulo!
          if (this.jumpBuffer > 0) {
            this.jumpBuffer = 0;
            this.jump();
          }
        }

        if (this.jumpBuffer > 0) this.jumpBuffer--;

        if (this.isGrounded) {
          this.runFrame += gameSpeed * 0.08;
          this.wobble = Math.sin(this.runFrame * 2) * 2;
        } else {
          this.wobble = -3;
        }
      }
    };

    // Ágata: Ruiva, correndo atrás com balão
    const agata = {
      x: 50,
      y: GROUND_Y - 90,
      width: 44,
      height: 90,
      runFrame: 0,
      speechTimer: 0,

      reset() {
        this.x = 50;
        this.y = GROUND_Y - 90;
        this.runFrame = 0;
        this.speechTimer = 0;
      },

      update() {
        this.runFrame += gameSpeed * 0.08;
        this.speechTimer += 0.03;
      }
    };

    // Obstáculos BAIXOS e FÁCEIS de pular!
    const OBSTACLES = [
      { type: 'fence', width: 34, height: 36, name: 'Cerca' },
      { type: 'hay', width: 40, height: 30, name: 'Fardo de Feno' },
      { type: 'puddle', width: 46, height: 14, name: 'Poça de Água' },
      { type: 'pumpkin', width: 34, height: 26, name: 'Abóbora' },
      { type: 'chicken', width: 30, height: 26, name: 'Galinha' }
    ];

    let activeObstacles = [];
    let nextObstacleDistance = 240; // Espaço inicial generoso

    function spawnObstacle() {
      const proto = OBSTACLES[Math.floor(Math.random() * OBSTACLES.length)];
      activeObstacles.push({
        type: proto.type,
        width: proto.width,
        height: proto.height,
        x: V_W + 30,
        y: GROUND_Y - proto.height,
        animFrame: 0
      });
    }

    // Partículas leves (limite de 8 para não pesar na GPU mobile)
    let dustParticles = [];
    function spawnDust(x, y, count = 3) {
      if (dustParticles.length > 8) return;
      for (let i = 0; i < count; i++) {
        dustParticles.push({
          x: x,
          y: y - 2,
          vx: -(Math.random() * 2 + 1),
          vy: -(Math.random() * 1.5 + 0.5),
          size: Math.random() * 4 + 3,
          alpha: 0.8
        });
      }
    }

    // Bath Scene Bubbles
    let bathBubbles = [];
    function initBathScene() {
      bathBubbles = [];
      playSound('splash');
      for (let i = 0; i < 14; i++) {
        bathBubbles.push({
          x: 200 + Math.random() * 400,
          y: 160 + Math.random() * 220,
          radius: 12 + Math.random() * 18,
          vy: -(0.5 + Math.random() * 1.0),
          popped: false
        });
      }
    }

    /* ==========================================================================
       SUPER LIGHTWEIGHT RENDERING PIPELINE (Zero shadowBlur, Pure 60 FPS)
       ========================================================================== */

    // 1. Duk: Cachorrinho preto gordinho e fofo
    function drawDuk(x, y) {
      ctx.save();
      ctx.translate(x, y + duk.wobble);

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(28, duk.height + 2 - duk.wobble, 26, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Rabinho
      const tailWiggle = Math.sin(duk.runFrame * 3) * 0.3;
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.ellipse(4, 18, 5, 10, -0.4 + tailWiggle, 0, Math.PI * 2);
      ctx.fill();

      // Patinhas correndo (Ciclo simples de 2 círculos)
      const legOffset = duk.isGrounded ? Math.sin(duk.runFrame) * 8 : 0;
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(14 + legOffset, 36, 6, 0, Math.PI * 2);
      ctx.arc(42 - legOffset, 36, 6, 0, Math.PI * 2);
      ctx.fill();

      // Corpo Gordinho Preto
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.ellipse(28, 22, 24, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Barriguinha cinza escuro
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(28, 26, 17, 10, 0, 0, Math.PI);
      ctx.fill();

      // Cabeça & Focinho
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(44, 14, 14, 0, Math.PI * 2);
      ctx.fill();

      // Focinho
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(54, 16, 9, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Nariz preto
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(60, 14, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Olho expressivo
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(47, 11, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(46, 11, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Coleira vermelha
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(38, 20, 4, 8, -0.3, 0, Math.PI * 2);
      ctx.fill();

      // Orelha caidinha balançando
      const earSwing = duk.isGrounded ? Math.sin(duk.runFrame * 1.5) * 0.15 : -0.2;
      ctx.save();
      ctx.translate(38, 7);
      ctx.rotate(earSwing);
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.ellipse(0, 10, 5, 11, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    /* ==========================================================================
       SPRITES VETORIAIS DA ÁGATA (Menina Normal, Linda, com Cachos Ruivos)
       ========================================================================== */
    const agataSvgRun1 = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 92" width="64" height="92">
      <path d="M 26 36 L 16 48" stroke="#FFDFD6" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 26 56 L 15 72 L 10 78" stroke="#FFDFD6" stroke-width="5" stroke-linecap="round"/>
      <path d="M 7 77 L 15 77 Q 17 81 13 83 L 6 83 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
      <rect x="8" y="80" width="4" height="2.5" fill="#F43F5E" rx="0.5"/>

      <rect x="42" y="80" width="4" height="2.5" fill="#F43F5E" rx="0.5"/>

      <ellipse cx="35" cy="25" rx="3.5" ry="2" fill="#FB7185" opacity="0.6"/>
      <path d="M 31 19 Q 34.5 17 38 20" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <path d="M 38 20 L 40 18.5" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round"/>
      <ellipse cx="35" cy="21" rx="2.5" ry="2.2" fill="#FFFFFF"/>

      <circle cx="35.2" cy="20.3" r="0.6" fill="#FFFFFF"/>

      <path d="M 25 16 Q 28 8 36 10 Q 41 12 39 18 Q 35 15 30 17 Q 26 18 25 16 Z" fill="#E8590C"/>
      <path d="M 30 12 Q 35 12 36 16 Q 33 16 31 14 Z" fill="#F97316"/>
      <path d="M 27 18 Q 24 26 28 32 Q 25 38 28 44 Q 30 48 32 46 Q 31 42 28 38 Q 31 32 30 24 Z" fill="#EA580C"/>
      <path d="M 26 22 Q 22 28 26 34 Q 24 40 26 44 Q 28 46 30 44 Q 29 40 26 36 Q 29 30 28 24 Z" fill="#F97316"/>
      <path d="M 27 42 Q 29 46 32 44" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M 30 11 Q 35 11 37 13" stroke="#FEF08A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M 31 33 L 41 35 L 50 32" stroke="#FFDFD6" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 50 32 Q 53 31 55 33 Q 53 35 50 34 Z" fill="#FFDFD6"/>
      <path d="M 29 30 Q 33 31 35 35 L 30 36 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
    </svg>`;

    const agataSvgRun2 = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 92" width="64" height="92">
      <path d="M 26 36 Q 20 40 18 46" stroke="#FFDFD6" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 24 56 L 32 70 L 36 78" stroke="#FFDFD6" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 34 77 L 44 77 Q 46 81 42 83 L 32 83 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
      <rect x="36" y="80" width="4" height="2.5" fill="#F43F5E" rx="0.5"/>
      <path d="M 22 20 Q 13 26 14 36 Q 12 46 16 50 Q 21 52 23 46 Q 25 36 25 26 Z" fill="#9C4221"/>
      <path d="M 20 24 Q 14 32 17 42 Q 19 48 22 47 Q 24 41 24 30 Z" fill="#C92A2A"/>
      <path d="M 23 27 Q 29 26 36 28 Q 35 42 34 46 Q 27 46 23 44 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
      <path d="M 22 44 L 35 46 L 36 56 L 27 58 L 21 55 Z" fill="#0284C7" stroke="#0369A1" stroke-width="0.8"/>
      <path d="M 30 55 L 19 70 L 15 77" stroke="#FFDFD6" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 11 76 L 19 76 Q 21 80 17 82 L 10 82 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8"/>
      <rect x="12" y="79" width="4" height="2.5" fill="#F43F5E" rx="0.5"/>
      <path d="M 27 23 L 29 28 L 32 27 L 31 22 Z" fill="#FFDFD6"/>
      <path d="M 26 13 Q 40 11 39 21 Q 39 27 37 31 Q 32 34 28 32 Q 24 28 25 19 Z" fill="#FFDFD6"/>
      <ellipse cx="35" cy="24" rx="3.5" ry="2" fill="#FB7185" opacity="0.6"/>
      <path d="M 31 18 Q 34.5 16 38 19" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    // 2. Ágata: Menina Linda e Normal Correndo Atrás do Duk
    function drawAgata(x, y) {
      ctx.save();
      ctx.translate(x, y);

      const runCycle = agata.runFrame;
      const bob = Math.abs(Math.sin(runCycle * 2)) * 3;

      // Sombra suave no chão

      ctx.beginPath();
      ctx.ellipse(30, 92 - bob, 20, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Renderiza sprite da menina normal (stride alternado)
      const currentSprite = (Math.floor(runCycle) % 2 === 0) ? agataImg1 : agataImg2;
      ctx.drawImage(currentSprite, 0, -bob, 64, 92);

      // Balão de fala: "Vem banhar Duk!"

    // Balão de Fala Simples e Rápido
    function drawMobileSpeechBubble(bx, by, text) {
      ctx.save();
      ctx.font = 'bold 12px "Fredoka", sans-serif';
      const tw = ctx.measureText(text).width;
      const bw = tw + 16;
      const bh = 24;

      ctx.fillStyle = '#ffffff';

      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 8);
      ctx.fill();
      ctx.stroke();

      // Rabicho
      ctx.beginPath();
      ctx.moveTo(bx + 8, by + bh);
      ctx.lineTo(bx - 5, by + bh + 8);
      ctx.lineTo(bx + 18, by + bh);
      ctx.fill();

    // 3. Obstáculos BAIXOS e FÁCEIS (Desenho rápido sem lag)
    function drawObstacle(obs) {
      ctx.save();
      ctx.translate(obs.x, obs.y);

      // Sombra no chão
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(obs.width / 2, obs.height + 2, obs.width / 2 + 3, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.5;

      if (obs.type === 'fence') {
        // Cerca Baixa (34x36)
        ctx.fillStyle = '#d97706';
        ctx.fillRect(4, 0, 8, obs.height);
        ctx.strokeRect(4, 0, 8, obs.height);

        ctx.fillRect(22, 0, 8, obs.height);
        ctx.strokeRect(22, 0, 8, obs.height);

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(0, 8, obs.width, 8);
        ctx.strokeRect(0, 8, obs.width, 8);

        ctx.fillRect(0, 22, obs.width, 8);
        ctx.strokeRect(0, 22, obs.width, 8);

        // Faixa de aviso vermelha
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(4, 12, 8, 4);

      } else if (obs.type === 'hay') {
        // Fardo de Feno Redondo Baixo (40x30)
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.roundRect(0, 0, obs.width, obs.height, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(obs.width / 2, obs.height / 2, 8, 0, Math.PI * 2);
        ctx.stroke();

      } else if (obs.type === 'puddle') {
        // Poça de Água Azul e Lama Baixa (46x14)
        ctx.fillStyle = '#3e1f07';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 2, obs.width / 2, obs.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Água azul clara no meio
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 1, obs.width / 2 - 6, obs.height / 2 - 3, 0, 0, Math.PI * 2);
        ctx.fill();

      } else if (obs.type === 'pumpkin') {
        // Abóbora Baixinha (34x26)
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 2, obs.width / 2, obs.height / 2 - 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#16a34a'; // Talo verde
        ctx.fillRect(obs.width / 2 - 2, 0, 5, 6);

      } else if (obs.type === 'chicken') {
        // Galinha Branca Pequena (30x26)
        obs.animFrame += 0.2;

        ctx.fillStyle = '#ffffff';

        // Bico amarelo
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(obs.width / 2 + 10, obs.height / 2 - 2, 4, 3);
      }

      ctx.restore();
    }

      // Chão: Grama e Estrada de Terra

    /* ==========================================================================
       COLISÃO HIPER-AMIGÁVEL & GAME LOOP
       ========================================================================== */

    // Hitbox com margem de tolerância generosa (não morre de raspão!)
    function checkCollision(dukObj, obs) {
      const d = {
        x: dukObj.x + 14,
        y: dukObj.y + 12,
        w: dukObj.width - 24,
        h: dukObj.height - 14
      };
      const o = {
        x: obs.x + 6,
        y: obs.y + 8,
        w: obs.width - 12,
        h: obs.height - 8
      };

      return (
        d.x < o.x + o.w &&
        d.x + d.w > o.x &&
        d.y < o.y + o.h &&
        d.y + d.h > o.y
      );
    }

    function triggerGameOver() {
      if (gameState === STATE_GAMEOVER) return;
      gameState = STATE_GAMEOVER;
      playSound('hit');

      if (Math.floor(distance) > highscore) {
        highscore = Math.floor(distance);
        localStorage.setItem('duk_mobile_record', highscore.toString());
        recordVal.innerText = highscore + 'm';
      }

      initBathScene();
    }

    function resetGame() {
      distance = 0;
      gameSpeed = baseSpeed;
      activeObstacles = [];
      nextObstacleDistance = 240;
      dustParticles = [];
      duk.reset();
      agata.reset();
      gameState = STATE_RUNNING;
    }

    // Update
    function update() {
      if (gameState === STATE_RUNNING) {
        distance += gameSpeed * 0.04;
        distanceVal.innerText = Math.floor(distance) + 'm';

        if (gameSpeed < maxSpeed) {
          gameSpeed += speedRate;
        }

        // Cenário
        scrollSky += gameSpeed * 0.2;
        scrollHills += gameSpeed * 0.5;
        scrollGround += gameSpeed * 1.0;

        duk.update();
        agata.update();

        // Obstáculos espaçados e fáceis
        nextObstacleDistance -= gameSpeed;
        if (nextObstacleDistance <= 0) {
          spawnObstacle();
          // Distância generosa entre pulos (320px a 480px)
          nextObstacleDistance = 320 + Math.random() * 160;
        }

        for (let i = activeObstacles.length - 1; i >= 0; i--) {
          const obs = activeObstacles[i];
          obs.x -= gameSpeed;

          if (checkCollision(duk, obs)) {
            triggerGameOver();
            break;
          }

          if (obs.x + obs.width < -40) {
            activeObstacles.splice(i, 1);
          }
        }

        // Partículas
        for (let i = dustParticles.length - 1; i >= 0; i--) {
          const p = dustParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.04;
          if (p.alpha <= 0) dustParticles.splice(i, 1);
        }
      }
    }

    // Render
    function render() {
      ctx.clearRect(0, 0, V_W, V_H);

      drawBackground();
      activeObstacles.forEach(drawObstacle);

      drawAgata(agata.x, agata.y);
      drawDuk(duk.x, duk.y);

      // Partículas de poeira
      dustParticles.forEach(p => {
        ctx.fillStyle = `rgba(217, 119, 6, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if (gameState === STATE_GAMEOVER) {
        drawBathScene();
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    /* ==========================================================================
       CONTROLES TOUCH ULTRA-RÁPIDOS (MOBILE-FIRST)
       ========================================================================== */

    function handlePlayerAction() {
      initAudio();

      if (gameState === STATE_START) {
        startScreen.style.display = 'none';
        hud.style.display = 'flex';
        jumpTip.style.display = 'block';
        setTimeout(() => { jumpTip.style.display = 'none'; }, 4000);
        resetGame();
      } else if (gameState === STATE_RUNNING) {
        duk.jump();
      } else if (gameState === STATE_GAMEOVER) {
        resetGame();
      }
    }

    // Toque em qualquer lugar da tela
    window.addEventListener('pointerdown', (e) => {
      // No Game Over, estoura bolhas se tocar nelas
      if (gameState === STATE_GAMEOVER) {
        const rect = canvas.getBoundingClientRect();
        const clickX = (e.clientX - rect.left) * (V_W / rect.width);
        const clickY = (e.clientY - rect.top) * (V_H / rect.height);

        let poppedBubble = false;
        bathBubbles.forEach(b => {
          if (!b.popped && Math.hypot(clickX - b.x, clickY - b.y) <= b.radius + 8) {
            b.popped = true;
            playSound('pop');
            poppedBubble = true;
          }
        });

        if (poppedBubble) return;

        // Se clicou no botão "Fugir de Novo" ou em qualquer lugar do Game Over
        resetGame();
        return;
      }

      handlePlayerAction();
    }, { passive: true });

    // Teclado (Espaço / Seta / W)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        handlePlayerAction();
      }
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handlePlayerAction();
    });
  </script>
</body>
</html>
