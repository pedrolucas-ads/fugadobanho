<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Duk: Fuga do Banho 🐾🧼</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    /* Canvas 100% Vertical (Celular em Pé) */
    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      background: #38bdf8;
    }

    /* HUD Superior */
    .hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 12px) + 12px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .badge {
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 7px 16px;
      border-radius: 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .badge .num {
      color: #facc15;
      font-size: 17px;
      font-weight: 800;
    }

    .audio-btn {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      cursor: pointer;
    }

    /* Tela de Início */
    #start-screen {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 30;
      padding: 24px;
    }

    .title-banner {
      background: linear-gradient(135deg, #f97316, #ea580c);
      padding: 12px 28px;
      border-radius: 28px;
      box-shadow: 0 8px 24px rgba(234, 88, 12, 0.45);
      border: 2px solid #ffedd5;
      margin-bottom: 18px;
      transform: rotate(-1.5deg);
    }

    .title-banner h1 {
      font-size: 25px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .story-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      padding: 16px 20px;
      margin-bottom: 22px;
      max-width: 320px;
      font-size: 15px;
      line-height: 1.45;
      color: #f1f5f9;
    }

    .story-card b {
      color: #facc15;
    }

    .play-btn {
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white;
      border: none;
      padding: 16px 52px;
      font-size: 22px;
      font-weight: 900;
      font-family: inherit;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.5);
      border: 2.5px solid #bbf7d0;
      animation: pulseBtn 1.8s infinite;
      touch-action: manipulation;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .hint-bar {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 14px) + 16px);
      background: rgba(15, 23, 42, 0.7);
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      color: #fef08a;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Canvas Fullscreen Vertical -->
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div class="hud" id="hud" style="display: none;">
    <div class="badge">
      <span>🐾 Fuga:</span>
      <span class="num" id="distanceVal">0m</span>
    </div>

    <div class="badge">
      <span>🏆 Recorde:</span>
      <span class="num" id="recordVal">0m</span>
    </div>

    <button class="audio-btn" id="audioToggle">🔊</button>
  </div>

  <div class="hint-bar" id="hintBar" style="display: none;">
    👆 Toque na tela para pular!
  </div>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <div class="title-banner">
      <h1>🐾 DUK: FUGA DO BANHO! 🧼</h1>
    </div>

    <div class="story-card">
      <div style="font-size: 40px; margin-bottom: 8px;">🐕‍🦺 💨 🚿</div>
      A <b>Ágata</b> está chamando o <b>Duk</b> para tomar banho na fazenda!<br><br>
      Ajude esse gordinho a pular os obstáculos e escapar do sabão!
    </div>

    <button class="play-btn" id="startBtn">CORRE DUK! 🐾</button>
  </div>

  <script>
    /* ==========================================================================
       DUK: FUGA DO BANHO - EDIÇÃO CELULAR VERTICAL 📱✨
       • 100% Otimizado para celular em pé (Portrait)
       • 60 FPS cravados e ultra-leve (Zero travamentos)
       • Sem desenho de pessoas: apenas balões charmosos e bem-humorados da Ágata
       • Duk gordinho, expressivo, com física macia de pulo
       ========================================================================== */

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const hintBar = document.getElementById('hintBar');
    const startScreen = document.getElementById('start-screen');
    const startBtn = document.getElementById('startBtn');
    const distanceVal = document.getElementById('distanceVal');
    const recordVal = document.getElementById('recordVal');
    const audioToggle = document.getElementById('audioToggle');

    // Resolução lógica vertical (380 x 680)
    const V_W = 380;
    const V_H = 680;
    let scaleRatio = 1;
    let offsetX = 0;
    let offsetY = 0;
    const GROUND_Y = 530; // Chão posicionado na parte inferior do celular

    function resize() {
      const realW = window.innerWidth;
      const realH = window.innerHeight;
      canvas.width = realW;
      canvas.height = realH;

      // Escala mantendo proporção ideal no celular em pé
      const sX = realW / V_W;
      const sY = realH / V_H;
      scaleRatio = Math.max(sX, sY); // Preenche 100% da tela sem bordas

      offsetX = (realW - V_W * scaleRatio) / 2;
      offsetY = (realH - V_H * scaleRatio) / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estados
    const STATE_START = 0;
    const STATE_RUNNING = 1;
    const STATE_GAMEOVER = 2;
    let gameState = STATE_START;

    // Pontuação
    let distance = 0;
    let highscore = parseInt(localStorage.getItem('duk_vertical_record') || '0', 10);
    recordVal.innerText = highscore + 'm';

    // Velocidade gostosa e suave
    let baseSpeed = 3.2;
    let gameSpeed = 3.2;
    let maxSpeed = 5.2;

    // Áudio Sintetizado Web Audio (Leve, sem download, sem falhas)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'jump') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(540, now + 0.14);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'hit') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.22);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.23);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'splash') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(560, now + 0.12);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.14);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
          osc.start(now);
          osc.stop(now + 0.07);
        }
      } catch(e) {}
    }

    audioToggle.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      audioToggle.innerText = soundEnabled ? '🔊' : '🔇';
      if (soundEnabled) initAudio();
    });

    /* ==========================================================================
       PERSONAGEM: DUK (O Cachorro Preto Gordo)
       ========================================================================== */

    const duk = {
      x: 95,
      y: GROUND_Y - 44,
      width: 58,
      height: 42,
      vy: 0,
      gravity: 0.58,
      jumpForce: -13.2,
      isGrounded: true,
      jumpBuffer: 0,
      runFrame: 0,

      reset() {
        this.x = 95;
        this.y = GROUND_Y - 44;
        this.vy = 0;
        this.isGrounded = true;
        this.jumpBuffer = 0;
        this.runFrame = 0;
      },

      jump() {
        if (this.isGrounded) {
          this.vy = this.jumpForce;
          this.isGrounded = false;
          playSound('jump');
          spawnDust(this.x + 24, GROUND_Y);
        } else {
          this.jumpBuffer = 8;
        }
      },

      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        if (this.y >= GROUND_Y - 44) {
          this.y = GROUND_Y - 44;
          this.vy = 0;
          this.isGrounded = true;

          if (this.jumpBuffer > 0) {
            this.jumpBuffer = 0;
            this.jump();
          }
        }

        if (this.jumpBuffer > 0) this.jumpBuffer--;

        if (this.isGrounded) {
          this.runFrame += gameSpeed * 0.1;
        }
      }
    };

    // Balão de fala chamando de longe
    let speechTimer = 0;
    const agataPhrases = [
      "Vem banhar, Duk! 🚿",
      "Volta aqui, gordinho! 🧼",
      "Olha o shampoo de morango! 🍓",
      "Duk! Hoje tem banho sim! 🐾",
      "Vem ficar cheiroso, Duk! ✨"
    ];
    let currentPhrase = agataPhrases[0];

    // Obstáculos baixos e fáceis
    const OBSTACLES = [
      { type: 'fence', width: 32, height: 32 },
      { type: 'hay', width: 36, height: 26 },
      { type: 'puddle', width: 42, height: 12 },
      { type: 'pumpkin', width: 32, height: 24 },
      { type: 'chicken', width: 28, height: 24 }
    ];

    let activeObstacles = [];
    let nextObstacleDistance = 220;

    function spawnObstacle() {
      const proto = OBSTACLES[Math.floor(Math.random() * OBSTACLES.length)];
      activeObstacles.push({
        type: proto.type,
        width: proto.width,
        height: proto.height,
        x: V_W + 20,
        y: GROUND_Y - proto.height,
        animFrame: 0
      });
    }

    // Partículas leves
    let dustParticles = [];
    function spawnDust(x, y) {
      if (dustParticles.length > 5) return;
      dustParticles.push({
        x: x,
        y: y - 2,
        vx: -(Math.random() * 2 + 1),
        vy: -(Math.random() * 1.5 + 0.5),
        size: Math.random() * 3 + 3,
        alpha: 0.8
      });
    }

    // Bolhas do banho
    let bathBubbles = [];
    function initBathScene() {
      bathBubbles = [];
      playSound('splash');
      for (let i = 0; i < 14; i++) {
        bathBubbles.push({
          x: 40 + Math.random() * (V_W - 80),
          y: 200 + Math.random() * 320,
          radius: 12 + Math.random() * 16,
          vy: -(0.5 + Math.random() * 1.0),
          popped: false
        });
      }
    }

    /* ==========================================================================
       DESENHO GRÁFICO (60 FPS NATIVO & SUPER LIMPO)
       ========================================================================== */

    // 1. Duk (Cachorrinho preto gordinho e expressivo)
    function drawDuk(x, y) {
      ctx.save();
      const wobble = duk.isGrounded ? Math.sin(duk.runFrame * 2) * 2 : -3;
      ctx.translate(x, y + wobble);

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.beginPath();
      ctx.ellipse(28, duk.height + 2 - wobble, 26, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Rabinho abanando
      const tailSwing = Math.sin(duk.runFrame * 2.5) * 0.3;
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.ellipse(4, 18, 5, 10, -0.4 + tailSwing, 0, Math.PI * 2);
      ctx.fill();

      // Patinhas
      const leg = duk.isGrounded ? Math.sin(duk.runFrame) * 7 : 0;
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(14 + leg, 36, 6, 0, Math.PI * 2);
      ctx.arc(42 - leg, 36, 6, 0, Math.PI * 2);
      ctx.fill();

      // Corpo Gordinho Preto
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.ellipse(28, 22, 24, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      // Barriga
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(28, 26, 17, 10, 0, 0, Math.PI);
      ctx.fill();

      // Cabeça & Focinho
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(44, 14, 14, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(54, 16, 9, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Nariz
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(60, 14, 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Olho expressivo
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(47, 11, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(46, 11, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Coleira vermelha com medalhinha
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(38, 20, 4, 8, -0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.arc(41, 25, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Orelha caidinha balançando
      const ear = duk.isGrounded ? Math.sin(duk.runFrame * 1.5) * 0.15 : -0.2;
      ctx.save();
      ctx.translate(38, 7);
      ctx.rotate(ear);
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.ellipse(0, 10, 5, 11, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    // 2. Balão da Ágata Chamando de Longe 💬
    function drawCallingBubble() {
      ctx.save();
      const wobble = Math.sin(speechTimer * 3.5) * 4;
      const bx = 16;
      const by = GROUND_Y - 145 + wobble;

      ctx.font = 'bold 13px "Fredoka", sans-serif';
      const tw = ctx.measureText(currentPhrase).width;
      const bw = tw + 24;
      const bh = 32;

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.beginPath();
      ctx.roundRect(bx + 2, by + 2, bw, bh, 14);
      ctx.fill();

      // Balão
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 14);
      ctx.fill();
      ctx.stroke();

      // Rabicho apontando para fora da tela à esquerda (de onde vem a voz dela)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(bx + 8, by + bh);
      ctx.lineTo(bx - 8, by + bh + 10);
      ctx.lineTo(bx + 20, by + bh);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 7, by + bh - 2, 14, 4);

      // Ícone de megafone / som
      ctx.fillStyle = '#e11d48';
      ctx.fillText(currentPhrase, bx + 12, by + 21);

      ctx.restore();
    }

    // 3. Obstáculos Rurais Baixos
    function drawObstacle(obs) {
      ctx.save();
      ctx.translate(obs.x, obs.y);

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(obs.width / 2, obs.height + 2, obs.width / 2 + 2, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2.2;

      if (obs.type === 'fence') {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(4, 0, 7, obs.height);
        ctx.strokeRect(4, 0, 7, obs.height);
        ctx.fillRect(21, 0, 7, obs.height);
        ctx.strokeRect(21, 0, 7, obs.height);

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(0, 7, obs.width, 7);
        ctx.strokeRect(0, 7, obs.width, 7);
        ctx.fillRect(0, 18, obs.width, 7);
        ctx.strokeRect(0, 18, obs.width, 7);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(4, 10, 7, 4);

      } else if (obs.type === 'hay') {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.roundRect(0, 0, obs.width, obs.height, 9);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#eab308';
        ctx.beginPath();
        ctx.arc(obs.width / 2, obs.height / 2, 6.5, 0, Math.PI * 2);
        ctx.stroke();

      } else if (obs.type === 'puddle') {
        ctx.fillStyle = '#3e1f07';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 2, obs.width / 2, obs.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 1, obs.width / 2 - 5, obs.height / 2 - 3, 0, 0, Math.PI * 2);
        ctx.fill();

      } else if (obs.type === 'pumpkin') {
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 2, obs.width / 2, obs.height / 2 - 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#16a34a';
        ctx.fillRect(obs.width / 2 - 2, 0, 4, 5);

      } else if (obs.type === 'chicken') {
        obs.animFrame += 0.2;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(obs.width / 2, obs.height / 2 + 2, 11, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(obs.width / 2 + 3, obs.height / 2 - 8, 4, 4);

        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(obs.width / 2 + 8, obs.height / 2 - 2, 4, 3);
      }

      ctx.restore();
    }

    // 4. Cenário de Fazenda Vertical
    let scrollSky = 0;
    let scrollHills = 0;
    let scrollGround = 0;

    function drawBackground() {
      // Céu azul alto de interior
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(0, 0, V_W, GROUND_Y);

      // Sol da manhã
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.arc(V_W - 60, 60, 32, 0, Math.PI * 2);
      ctx.fill();

      // Nuvens fofas
      drawCloud((70 - scrollSky * 0.2) % (V_W + 100), 50);
      drawCloud((240 - scrollSky * 0.25) % (V_W + 100), 90);

      // Colinas distantes verdes
      ctx.fillStyle = '#86efac';
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.quadraticCurveTo(V_W * 0.35, 410, V_W * 0.7, 435);
      ctx.quadraticCurveTo(V_W * 0.9, 450, V_W, 430);
      ctx.lineTo(V_W, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      // Colinas médias + Casinha da fazenda
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.quadraticCurveTo(V_W * 0.4, 460, V_W * 0.75, 480);
      ctx.quadraticCurveTo(V_W * 0.95, 495, V_W, 480);
      ctx.lineTo(V_W, GROUND_Y);
      ctx.closePath();
      ctx.fill();

      // Celeiro vermelho da fazenda ao longe
      const barnX = (210 - scrollHills * 0.4) % (V_W + 140);
      drawMiniBarn(barnX, 445);

      // Chão: Grama e Estrada de Terra
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(0, GROUND_Y - 10, V_W, 10);

      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, GROUND_Y, V_W, V_H - GROUND_Y);

      // Textura da estrada
      ctx.fillStyle = 'rgba(254, 240, 138, 0.2)';
      const trackOffset = (scrollGround * 1.5) % 50;
      for (let tx = -trackOffset; tx < V_W; tx += 50) {
        ctx.fillRect(tx, GROUND_Y + 14, 20, 3);
        ctx.fillRect(tx + 24, GROUND_Y + 45, 18, 3);
        ctx.fillRect(tx + 10, GROUND_Y + 80, 22, 3);
      }
    }

    function drawCloud(cx, cy) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.arc(cx + 16, cy - 4, 18, 0, Math.PI * 2);
      ctx.arc(cx + 34, cy, 14, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawMiniBarn(bx, by) {
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(bx, by, 34, 24);
      ctx.fillStyle = '#7f1d1d';
      ctx.beginPath();
      ctx.moveTo(bx - 3, by);
      ctx.lineTo(bx + 17, by - 10);
      ctx.lineTo(bx + 37, by);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(bx + 10, by + 9, 14, 15);
    }

    /* ==========================================================================
       CENA DO BANHO NO GAME OVER (LIMPA, FOFA & DIVERTIDA) 🚿🧼
       ========================================================================== */

    let bathAnim = 0;
    function drawBathCutscene() {
      bathAnim += 0.04;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.fillRect(0, 0, V_W, V_H);

      // Deck de madeira
      ctx.fillStyle = '#78350f';
      ctx.fillRect(0, 480, V_W, V_H - 480);

      // Bacia de Madeira no centro
      const tubX = Math.round(V_W / 2 - 110);
      const tubY = 370;
      const tubW = 220;
      const tubH = 110;

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(tubX + tubW / 2, tubY + tubH + 4, tubW / 2 + 10, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      // Água azul clara
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.ellipse(tubX + tubW / 2, tubY + 20, tubW / 2 - 12, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      // DUK ENSABOADO DENTRO DA BACIA (Carinha impagável!)
      ctx.save();
      ctx.translate(tubX + tubW / 2 - 40, tubY - 50);

      // Cabeça do Duk
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.arc(40, 36, 28, 0, Math.PI * 2);
      ctx.fill();

      // Orelhas molhadas caídas
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.ellipse(14, 44, 6, 16, 0.2, 0, Math.PI * 2);
      ctx.ellipse(66, 44, 6, 16, -0.2, 0, Math.PI * 2);
      ctx.fill();

      // Olhos gigantes de coitado
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(31, 34, 5.5, 0, Math.PI * 2);
      ctx.arc(49, 34, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(31, 36, 3, 0, Math.PI * 2);
      ctx.arc(49, 36, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(29.5, 34.5, 1.2, 0, Math.PI * 2);
      ctx.arc(47.5, 34.5, 1.2, 0, Math.PI * 2);
      ctx.fill();

      // Focinho
      ctx.fillStyle = '#27272a';
      ctx.beginPath();
      ctx.ellipse(40, 48, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#09090b';
      ctx.beginPath();
      ctx.arc(40, 45, 4, 0, Math.PI * 2);
      ctx.fill();

      // Patinhas na borda da bacia
      ctx.fillStyle = '#18181b';
      ctx.beginPath();
      ctx.ellipse(18, 70, 9, 6, -0.2, 0, Math.PI * 2);
      ctx.ellipse(62, 70, 9, 6, 0.2, 0, Math.PI * 2);
      ctx.fill();

      // Montanha de espuma branca na cabeça!
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(30, 12, 11, 0, Math.PI * 2);
      ctx.arc(50, 12, 11, 0, Math.PI * 2);
      ctx.arc(40, 2, 14, 0, Math.PI * 2);
      ctx.arc(40, -10, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Bacia frontal de madeira
      ctx.fillStyle = '#b45309';
      ctx.beginPath();
      ctx.ellipse(tubX + tubW / 2, tubY + 22, tubW / 2, 22, 0, 0, Math.PI);
      ctx.lineTo(tubX, tubY + tubH);
      ctx.ellipse(tubX + tubW / 2, tubY + tubH, tubW / 2, 20, 0, 0, Math.PI);
      ctx.lineTo(tubX + tubW, tubY + 22);
      ctx.closePath();
      ctx.fill();

      // Aros de ferro
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(tubX + tubW / 2, tubY + 52, tubW / 2 - 2, 18, 0, 0, Math.PI);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(tubX + tubW / 2, tubY + 86, tubW / 2 - 4, 18, 0, 0, Math.PI);
      ctx.stroke();

      // Espuma escorrendo da bacia
      ctx.fillStyle = '#ffffff';
      for (let bx = tubX + 25; bx <= tubX + tubW - 25; bx += 32) {
        ctx.beginPath();
        ctx.arc(bx, tubY + 23, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      // Balão Grandão da Ágata com a Fala Pedida
      const wiggle = Math.sin(bathAnim * 4) * 3;
      drawVictoryBubble(V_W / 2, 220 + wiggle, "Te peguei seu safado! 🧼");

      // Bolhas de sabão subindo pela tela
      bathBubbles.forEach(b => {
        if (!b.popped) {
          b.y += b.vy;
          if (b.y < -30) b.y = V_H + 20;
          ctx.save();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      });

      // Painel com Recorde e Botão de Reiniciar
      drawScoreCard(V_W / 2, 85);
    }

    function drawVictoryBubble(cx, cy, text) {
      ctx.save();
      ctx.font = '900 21px "Fredoka", sans-serif';
      const tw = ctx.measureText(text).width;
      const bw = tw + 34;
      const bh = 52;
      const bx = cx - bw / 2;
      const by = cy - bh / 2;

      // Sombra
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.roundRect(bx + 3, by + 3, bw, bh, 20);
      ctx.fill();

      // Balão
      ctx.fillStyle = '#fff1f2';
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, 20);
      ctx.fill();
      ctx.stroke();

      // Rabicho apontando para a bacia
      ctx.fillStyle = '#fff1f2';
      ctx.beginPath();
      ctx.moveTo(cx - 14, by + bh);
      ctx.lineTo(cx, by + bh + 16);
      ctx.lineTo(cx + 14, by + bh);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#fff1f2';
      ctx.fillRect(cx - 12, by + bh - 2, 24, 4);

      // Texto
      ctx.fillStyle = '#be123c';
      ctx.textAlign = 'center';
      ctx.fillText(text, cx, by + 34);

      ctx.restore();
    }

    function drawScoreCard(cx, cy) {
      ctx.save();
      const cardW = 300;
      const cardH = 110;
      const bx = cx - cardW / 2;
      const by = cy;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(bx, by, cardW, cardH, 20);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#facc15';
      ctx.font = '800 17px "Fredoka", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🚿 HORA DO BANHO! 🛁', cx, by + 30);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '600 14px "Fredoka", sans-serif';
      ctx.fillText(`Distância: ${Math.floor(distance)}m  •  Recorde: ${highscore}m`, cx, by + 60);

      // Botão grande
      const btnW = 220;
      const btnH = 42;
      const btnX = cx - btnW / 2;
      const btnY = by + 74;

      ctx.fillStyle = '#16a34a';
      ctx.beginPath();
      ctx.roundRect(btnX, btnY, btnW, btnH, 21);
      ctx.fill();
      ctx.strokeStyle = '#bbf7d0';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 15px "Fredoka", sans-serif';
      ctx.fillText('Fugir de Novo! 🐾', cx, btnY + 27);

      ctx.restore();
    }

    /* ==========================================================================
       LOOP DO JOGO & COLISÃO SUPER AMIGÁVEL
       ========================================================================== */

    function checkCollision(dukObj, obs) {
      // Hitbox bem tolerante: só morre se bater no meio
      const d = {
        x: dukObj.x + 16,
        y: dukObj.y + 14,
        w: dukObj.width - 26,
        h: dukObj.height - 16
      };
      const o = {
        x: obs.x + 6,
        y: obs.y + 8,
        w: obs.width - 12,
        h: obs.height - 8
      };

      return (
        d.x < o.x + o.w &&
        d.x + d.w > o.x &&
        d.y < o.y + o.h &&
        d.y + d.h > o.y
      );
    }

    function triggerGameOver() {
      if (gameState === STATE_GAMEOVER) return;
      gameState = STATE_GAMEOVER;
      playSound('hit');

      if (Math.floor(distance) > highscore) {
        highscore = Math.floor(distance);
        localStorage.setItem('duk_vertical_record', highscore.toString());
        recordVal.innerText = highscore + 'm';
      }

      initBathScene();
    }

    function resetGame() {
      distance = 0;
      gameSpeed = baseSpeed;
      activeObstacles = [];
      nextObstacleDistance = 220;
      dustParticles = [];
      duk.reset();
      gameState = STATE_RUNNING;
    }

    function update() {
      if (gameState === STATE_RUNNING) {
        distance += gameSpeed * 0.04;
        distanceVal.innerText = Math.floor(distance) + 'm';

        if (gameSpeed < maxSpeed) {
          gameSpeed += 0.00015;
        }

        // Cenário rolando
        scrollSky += gameSpeed * 0.2;
        scrollHills += gameSpeed * 0.5;
        scrollGround += gameSpeed * 1.0;

        duk.update();

        // Balão da Ágata variando as frases a cada 8 metros
        speechTimer += 0.04;
        const phraseIdx = Math.floor(distance / 8) % agataPhrases.length;
        currentPhrase = agataPhrases[phraseIdx];

        // Obstáculos espaçados e tranquilos
        nextObstacleDistance -= gameSpeed;
        if (nextObstacleDistance <= 0) {
          spawnObstacle();
          nextObstacleDistance = 240 + Math.random() * 150;
        }

        for (let i = activeObstacles.length - 1; i >= 0; i--) {
          const obs = activeObstacles[i];
          obs.x -= gameSpeed;

          if (checkCollision(duk, obs)) {
            triggerGameOver();
            break;
          }

          if (obs.x + obs.width < -30) {
            activeObstacles.splice(i, 1);
          }
        }

        // Poeira
        for (let i = dustParticles.length - 1; i >= 0; i--) {
          const p = dustParticles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= 0.04;
          if (p.alpha <= 0) dustParticles.splice(i, 1);
        }
      }
    }

    function render() {
      ctx.save();
      // Enquadramento 100% Fullscreen vertical
      ctx.translate(offsetX, offsetY);
      ctx.scale(scaleRatio, scaleRatio);

      ctx.clearRect(0, 0, V_W, V_H);

      drawBackground();
      activeObstacles.forEach(drawObstacle);

      // Duk correndo
      drawDuk(duk.x, duk.y);

      // Balão de fala da Ágata vindo da esquerda
      if (gameState === STATE_RUNNING) {
        drawCallingBubble();
      }

      // Poeira
      dustParticles.forEach(p => {
        ctx.fillStyle = `rgba(217, 119, 6, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Cena do Banho
      if (gameState === STATE_GAMEOVER) {
        drawBathCutscene();
      }

      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    /* ==========================================================================
       TOQUE SUPER RESPONSIVO NO CELULAR
       ========================================================================== */

    function handleAction() {
      initAudio();

      if (gameState === STATE_START) {
        startScreen.style.display = 'none';
        hud.style.display = 'flex';
        hintBar.style.display = 'block';
        setTimeout(() => { hintBar.style.display = 'none'; }, 3500);
        resetGame();
      } else if (gameState === STATE_RUNNING) {
        duk.jump();
      } else if (gameState === STATE_GAMEOVER) {
        resetGame();
      }
    }

    window.addEventListener('pointerdown', (e) => {
      if (gameState === STATE_GAMEOVER) {
        const clickX = (e.clientX - offsetX) / scaleRatio;
        const clickY = (e.clientY - offsetY) / scaleRatio;

        let popped = false;
        bathBubbles.forEach(b => {
          if (!b.popped && Math.hypot(clickX - b.x, clickY - b.y) <= b.radius + 8) {
            b.popped = true;
            playSound('pop');
            popped = true;
          }
        });
        if (popped) return;

        resetGame();
        return;
      }

      handleAction();
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        handleAction();
      }
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      handleAction();
    });
  </script>
</body>
